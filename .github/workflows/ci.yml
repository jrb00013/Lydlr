name: CI

on:
  push:
  pull_request:

jobs:
  test-and-bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu || true

      - name: Verify bench_baselines import
        run: |
          PYTHONPATH=ros2/src/lydlr_ai python -c "from lydlr_ai.model import bench_baselines; print('bench_baselines ok')"

      - name: Health probe (fixtures + imports)
        run: |
          PYTHONPATH=ros2/src/lydlr_ai python scripts/health_probe.py
          PYTHONPATH=ros2/src/lydlr_ai python scripts/check_fixtures.py

      - name: Pytest (full ROS-free suite)
        run: |
          PYTHONPATH=ros2/src/lydlr_ai pytest tests/ -q

      - name: prove_beat_jpeg (checked-in correlated clip)
        run: |
          PYTHONPATH=ros2/src/lydlr_ai python scripts/prove_beat_jpeg.py \
            --fixture scripts/fixture_correlated_clip.npz --frames 12 --max-width 160

      - name: prove Lydlr vision codec beats intra JPEG
        run: |
          PYTHONPATH=ros2/src/lydlr_ai python scripts/prove_lydlr_beats_jpeg.py \
            --fixture scripts/fixture_correlated_clip.npz --frames 8 --max-width 96

      - name: bench_codecs smoke
        run: |
          PYTHONPATH=ros2/src/lydlr_ai python scripts/bench_codecs.py \
            --clip scripts/fixture_correlated_clip.npz --codecs jpeg,lydlr --target-bpps 0.5 \
            --max-frames 6 \
            --out scripts/results/ci_rd_smoke.json

      - name: Summarize RD smoke JSON
        run: |
          PYTHONPATH=ros2/src/lydlr_ai python scripts/summarize_rd_json.py scripts/results/ci_rd_smoke.json
