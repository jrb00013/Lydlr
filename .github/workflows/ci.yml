name: CI

on:
  push:
  pull_request:

jobs:
  test-and-bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow opencv-python-headless pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu || true

      - name: Verify bench_baselines import
        run: |
          PYTHONPATH=ros2/src/lydlr_ai python -c "from lydlr_ai.model import bench_baselines; print('bench_baselines ok')"

      - name: Pytest (entropy + temporal residual)
        run: |
          set -e
          for f in tests/test_entropy_coder.py tests/test_temporal_residual.py; do
            if [ -f "$f" ]; then
              PYTHONPATH=ros2/src/lydlr_ai pytest "$f" -q
            else
              echo "skip missing $f"
            fi
          done

      - name: prove_beat_jpeg (synthetic correlated clip)
        run: |
          PYTHONPATH=ros2/src/lydlr_ai python scripts/prove_beat_jpeg.py --synthetic --frames 12 --max-width 160

      - name: bench_codecs smoke
        run: |
          PYTHONPATH=ros2/src/lydlr_ai python scripts/bench_codecs.py \
            --synthetic 4 --codecs jpeg,webp --target-bpps 0.2 \
            --out scripts/results/ci_rd_smoke.json
